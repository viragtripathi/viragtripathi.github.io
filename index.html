const gap = () => print("", "gap");
function hash(s){ let h = 2166136261; for (const ch of s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16).padStart(8,"0").slice(0,7); }
function find(name){ name = (name||"").toLowerCase().replace(/^~\/shipped\//,"").replace(/\/$/,""); return SHIP.find(s => s.k === name || s.alias.includes(name)); }

/* ---------- matrix rain ---------- */

let fxTimer = null;
function runMatrix(ms){
  if(fxTimer) return;
  const win = $("#win");
  const c = document.createElement("canvas");
  c.style.cssText = "position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:12px";
  win.appendChild(c);
  const r = win.getBoundingClientRect(); c.width = r.width; c.height = r.height;
  const ctx = c.getContext("2d");
  const fs = 14, cols = Math.floor(c.width / fs), drops = new Array(cols).fill(1);
  const glyphs = "アイウエオカキクケコサシスセソ01{}<>/=;CRDBSQL";
  const dark = document.documentElement.dataset.theme !== "light";
  fxTimer = setInterval(() => {
    ctx.fillStyle = dark ? "rgba(13,17,23,0.14)" : "rgba(251,250,246,0.2)";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = dark ? "#7ee787" : "#1a7f37";
    ctx.font = fs + "px 'JetBrains Mono',monospace";
    for(let i = 0; i < drops.length; i++){
      ctx.fillText(glyphs[Math.floor(Math.random() * glyphs.length)], i * fs, drops[i] * fs);
      if(drops[i] * fs > c.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }, 50);
  setTimeout(() => { clearInterval(fxTimer); fxTimer = null; c.remove(); }, ms);
}

async function run(raw, echo = true){
  const line = raw.trim();
  if(echo) print(`${PS1} ${esc(line)}`);
  if(!line) return;
  hist.push(line); hi = hist.length;
  const [name, ...args] = line.split(/\s+/);
  const fn = CMD[name.toLowerCase()];
  if(fn) await fn(args);
  else if(find(name)) await CMD.cat([name]);
  else print(`<span class="r">command not found: ${esc(name)}</span>. type ${C("help")}`);
}

/* ---------- input handling ---------- */

input.addEventListener("keydown", async e => {
  if(!$("#gui").hidden){ showGui(false); }
  if(e.key === "Enter"){
    if(busy){ e.preventDefault(); return; }
    const v = input.value; input.value = "";
    await run(v);
  } else if(e.key === "ArrowUp"){
    if(hi > 0){ hi--; input.value = hist[hi]; } e.preventDefault();
  } else if(e.key === "ArrowDown"){
    if(hi < hist.length - 1){ hi++; input.value = hist[hi]; } else { hi = hist.length; input.value = ""; } e.preventDefault();
  } else if(e.key === "Tab"){
    e.preventDefault();
    const parts = input.value.split(/\s+/);
    const pool = parts.length > 1 ? SHIP.filter(s => !s.hidden).map(s => s.k) : Object.keys(CMD);
    const cur = parts[parts.length - 1];
    const hits = pool.filter(w => w.startsWith(cur));
    if(hits.length === 1){ parts[parts.length - 1] = hits[0]; input.value = parts.join(" ") + " "; }
    else if(hits.length > 1){ print(`${PS1} ${esc(input.value)}`); print(`<span class="d">${hits.join("   ")}</span>`); }
  } else if(e.key === "l" && e.ctrlKey){
    e.preventDefault(); CMD.clear();
  }
});

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-cmd]");
  if(b){ if(busy) return; e.preventDefault(); await run(b.dataset.cmd); input.focus({preventScroll:true}); return; }
  if(e.target.closest("#screen") && !window.getSelection().toString() && !e.target.closest("a")) input.focus({preventScroll:true});
});

async function typeAndRun(cmd){
  for(const ch of cmd){ input.value += ch; await sleep(55); }
  await sleep(180); input.value = ""; await run(cmd);
}
